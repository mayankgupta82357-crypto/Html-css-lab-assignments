<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Theme</title>
    <style>
        :root {
            --primary: #7c3aed;
            --surface: #f3e8ff;
            --text: #2e1065;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--surface);
            color: var(--text);
            padding: 20px;
        }

        h1, button {
            color: white;
            background: var(--primary);
            padding: 12px;
            border: none;
            border-radius: 6px;
        }

        .panel {
            background: white;
            border: 2px solid var(--primary);
            padding: 16px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>My Theme</h1>
    <div class="panel">
        <p>This panel uses CSS variables for its theme.</p>
        <button>Learn More</button>
    </div>
</body>
</html>
