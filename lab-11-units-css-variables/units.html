<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 2rem;
        }

        .pixels {
            font-size: 20px;
        }

        .em-text {
            font-size: 1.5em;
        }

        .percentage {
            width: 80%;
            background-color: lightblue;
            padding: 10px;
        }

        .viewport {
            width: 50vw;
            background-color: lightgreen;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>CSS Units Example</h1>
    <p class="pixels">This text uses pixels (px).</p>
    <div class="em-text">This text uses em units.</div>
    <div class="percentage">This box uses 80% width.</div>
    <div class="viewport">This box uses 50vw width.</div>
</body>
</html>
