<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model</title>
    <style>
        .box {
            width: 250px;
            padding: 20px;
            border: 5px solid blue;
            margin: 30px;
            background-color: lightblue;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model</h1>
    <div class="box">
        This box demonstrates content, padding, border and margin.
    </div>
</body>
</html>
