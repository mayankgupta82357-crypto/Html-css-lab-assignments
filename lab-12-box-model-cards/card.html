<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .card {
            width: 280px;
            padding: 20px;
            margin: 40px auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }

        .card h2 {
            color: #2563eb;
        }

        .card button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>My Profile Card</h2>
        <p>Name: Mayank Gupta</p>
        <p>Course: B.Tech CSE</p>
        <button>View Profile</button>
    </div>
</body>
</html>
