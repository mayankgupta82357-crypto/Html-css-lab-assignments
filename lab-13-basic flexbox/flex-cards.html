<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f8fafc;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            flex: 1 1 200px;
            max-width: 300px;
            padding: 20px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>My Flexbox Cards</h1>

    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <p>HTML structures webpages.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>CSS styles webpages.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript adds interactivity.</p>
        </div>
    </div>
</body>
</html>
