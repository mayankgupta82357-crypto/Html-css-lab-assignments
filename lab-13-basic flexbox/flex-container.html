<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Container</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
            padding: 20px;
            background-color: #e2e8f0;
        }

        .item {
            padding: 25px;
            background-color: steelblue;
            color: white;
            text-align: center;
            flex: 1;
        }
    </style>
</head>
<body>
    <h1>Basic Flexbox</h1>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
</body>
</html>
