<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Choices</title>
</head>
<body>
    <h1>Student Preferences</h1>

    <form>
        <p>Select your course:</p>
        <input type="radio" id="cse" name="course" value="CSE">
        <label for="cse">CSE</label>

        <input type="radio" id="it" name="course" value="IT">
        <label for="it">IT</label>

        <p>Select your hobbies:</p>
        <input type="checkbox" id="coding" name="hobby" value="Coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="gaming" name="hobby" value="Gaming">
        <label for="gaming">Gaming</label>

        <p>Select your city:</p>
        <select name="city" id="city">
            <option value="Agra">Agra</option>
            <option value="Delhi">Delhi</option>
            <option value="Lucknow">Lucknow</option>
        </select>

        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
