<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Marks Table</title>
</head>
<body>
    <h1>Marks Report</h1>

    <table border="1">
        <caption>Marks of Students</caption>

        <thead>
            <tr>
                <th scope="col">Student Name</th>
                <th scope="col">HTML</th>
                <th scope="col">CSS</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Aman</th>
                <td>80</td>
                <td>85</td>
            </tr>
            <tr>
                <th scope="row">Priya</th>
                <td>90</td>
                <td>88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Average</th>
                <td>85</td>
                <td>86.5</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
